const OBF={},oudN=m=>Math.max(8,Math.round(ac.sampleRate/hz(m)-.5));let oudB=null;
function oudBus(){if(!oudB){const lo=ac.createBiquadFilter(),mid=ac.createBiquadFilter(),hi=ac.createBiquadFilter(),g=ac.createGain();lo.type='peaking';lo.frequency.value=210;lo.gain.value=4;lo.Q.value=1.1;mid.type='peaking';mid.frequency.value=1150;mid.gain.value=2.5;mid.Q.value=.9;hi.type='lowpass';hi.frequency.value=5200;lo.connect(mid);mid.connect(hi);hi.connect(g);g.connect(mus.g);oudB=lo}return oudB}
function oudBuf(m){if(OBF[m])return OBF[m];const sr=ac.sampleRate,N=oudN(m),len=Math.floor(sr*(m<52?2.4:m<68?1.9:1.4)),bf=ac.createBuffer(1,len,sr),D=bf.getChannelData(0),x=new Float32Array(N),y=new Float32Array(N);let lp=0,mx=0;
for(let i=0;i<N;i++){lp+=((Math.random()*2-1)-lp)*.6;x[i]=lp}
